name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Check Go module files
        run: go mod tidy -diff

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Lint Go
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0 run

      - name: Setup Buf
        uses: bufbuild/buf-action@v1.5.0
        with:
          setup_only: true
          version: "1.72.0"

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Lint protobuf
        run: buf lint

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Audit web dependencies
        run: pnpm --dir web audit --audit-level high

      - name: Check generated protobuf code
        run: |
          buf generate
          buf generate --template buf.gen.web.yaml
          git diff --exit-code -- gen web/src/gen

      - name: Test web
        run: pnpm --dir web test

      - name: Lint web
        run: pnpm --dir web lint

      - name: Build web
        run: NEXT_PUBLIC_API_URL= pnpm --dir web build

      - name: Validate installer scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          pwsh -NoLogo -NoProfile -Command '
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          '

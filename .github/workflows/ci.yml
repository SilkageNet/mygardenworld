name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Check Go module files
        run: go mod tidy -diff

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9.0.0
        with:
          version: v2.13.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint web
        run: pnpm --dir web lint

      - name: Build web
        run: NEXT_PUBLIC_API_URL= pnpm --dir web build

      - name: Validate installer scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          pwsh -NoLogo -NoProfile -Command '
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          '

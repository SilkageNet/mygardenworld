name: Community

on:
  issues:
    types:
      - opened
  # This workflow only posts a comment. It never checks out or executes PR code.
  pull_request_target:
    types:
      - opened

permissions: {}

jobs:
  welcome:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening an issue. Please include reproduction steps, environment and version details, and remove account credentials, session data, and sensitive packet-capture content. A maintainer will review it once enough information is available.
          pr_message: |
            Thanks for the contribution. Please use the pull request template to describe the scope, validation performed, and any protocol or resource-safety impact. A maintainer will continue the review after CI passes.

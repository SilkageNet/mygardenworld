name: 功能建议
description: 提议新的自动化能力、协议支持或使用体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述实际问题，再说明建议方案。协议行为以可验证的客户端观测为准。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和文档，确认没有相同建议。
          required: true
        - label: 该建议不依赖绕过广告、支付、平台鉴权或其他高风险流程。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 协议与状态解析
        - 自动化规划与执行
        - 账号、存储与 API
        - Web 控制台
        - 安装、更新与部署
        - 文档与开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到的限制、使用场景及影响。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、边界和可接受的实现方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选。说明已经尝试或考虑过的其他方案。

  - type: textarea
    id: evidence
    attributes:
      label: 协议观测或参考信息
      description: 可选。请提供已脱敏的观测结论、相关 RPC/namespace 或文档链接。

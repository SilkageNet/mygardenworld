name: 使用问题
description: 询问安装、配置、运行或项目能力边界
title: "[Question] "
labels:
  - question
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 README 并搜索现有 Issue。
          required: true
        - label: 我不会公开账号、密码、会话令牌或未经脱敏的抓包。
          required: true

  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 请明确说明想了解什么。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景信息
      description: 已尝试的操作、版本、环境及相关日志。
    validations:
      required: true

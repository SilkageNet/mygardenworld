version: v2

# Local plugin invocation only - no remote (buf.build/...) plugins.
# All three binaries are expected on PATH:
#   - protoc-gen-go         (google.golang.org/protobuf/cmd/protoc-gen-go)
#   - protoc-gen-go-grpc    (google.golang.org/grpc/cmd/protoc-gen-go-grpc)
#   - protoc-gen-connect-go (connectrpc.com/connect/cmd/protoc-gen-connect-go)
#
# If a tool is missing, install it via:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
#   go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/SilkageNet/mygardenworld/gen

plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # Connect-go bindings live alongside the gRPC ones so browser and future
  # service clients can share the same generated API surface.
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative

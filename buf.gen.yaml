version: v2

# Local plugin invocation only - no remote (buf.build/...) plugins.
# All three binaries are expected on PATH:
#   - protoc-gen-go         (google.golang.org/protobuf/cmd/protoc-gen-go)
#   - protoc-gen-go-grpc    (google.golang.org/grpc/cmd/protoc-gen-go-grpc)
#   - protoc-gen-connect-go (connectrpc.com/connect/cmd/protoc-gen-connect-go)
#
# If a tool is missing, install it via:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
#   go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/SilkageNet/mygardenworld/gen

plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # Connect-go bindings live alongside the gRPC ones. We don't depend on them
  # at runtime today, but generating now means cmd/gardenctl can be migrated
  # to Connect later (multi-machine + token auth) without a regen of the
  # whole tree.
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative

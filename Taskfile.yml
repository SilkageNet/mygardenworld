version: '3'

vars:
  DATA_DIR: '{{default "data" .DATA_DIR}}'
  DEBUG_DIR: '{{default "debug" .DEBUG_DIR}}'
  MINI_DIR: '{{default "tmp/mini" .MINI_DIR}}'
  CATALOG_CDN: '{{default "" .CATALOG_CDN}}'
  LISTEN: '{{default "127.0.0.1:50051" .LISTEN}}'
  FRONTEND_HOST: '{{default "127.0.0.1" .FRONTEND_HOST}}'
  FRONTEND_PORT: '{{default "3000" .FRONTEND_PORT}}'
  API_URL: '{{default "http://127.0.0.1:50051" .API_URL}}'
  JWT_SECRET: '{{default "" .JWT_SECRET}}'
  ADMIN_USERNAME: '{{default "admin" .ADMIN_USERNAME}}'
  ADMIN_PASSWORD: '{{default "" .ADMIN_PASSWORD}}'
  ADMIN_EMAIL: '{{default "admin@localhost" .ADMIN_EMAIL}}'
  CORS_ORIGINS: '{{default "http://localhost:3000,http://127.0.0.1:3000" .CORS_ORIGINS}}'
  SERVER_LOG_LEVEL: '{{default "info" .SERVER_LOG_LEVEL}}'
  SERVER_LOG_FORMAT: '{{default "text" .SERVER_LOG_FORMAT}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install gardend to GOPATH/bin
    cmds:
      - go install ./cmd/gardend

  build:
    desc: Build gardend to bin/
    cmds:
      - cmd: mkdir bin
        platforms: [windows]
        ignore_error: true
      - cmd: mkdir -p bin
        platforms: [linux, darwin]
      - cmd: go build -o bin/gardend.exe ./cmd/gardend
        platforms: [windows]
      - cmd: go build -o bin/gardend ./cmd/gardend
        platforms: [linux, darwin]

  catalog-gen:
    desc: Refresh client-derived protocol and catalog artifacts from unpacked mini-program data
    cmds:
      - >-
        go run ./cmd/gardencatalog
        --mini "{{.MINI_DIR}}"
        --cdn "{{.CATALOG_CDN}}"
        --state "internal/state/catalog_data.json"
        --web "web/src/lib/game/catalog.json"
        --protocol-package "internal/babigame/clientproto"
        --rpc-facade "internal/babigame/clientrpc/rpc_facade.go"

  reset-data:
    desc: Delete local DATA_DIR via gardend reset-data
    cmds:
      - go run ./cmd/gardend reset-data --data-dir "{{.DATA_DIR}}" --yes

  backend:
    desc: Start gardend API server for local development
    aliases: [server, api]
    cmds:
      - >-
        go run ./cmd/gardend serve
        --data-dir "{{.DATA_DIR}}"
        --listen "{{.LISTEN}}"
        --jwt-secret "{{.JWT_SECRET}}"
        --admin-username "{{.ADMIN_USERNAME}}"
        --admin-password "{{.ADMIN_PASSWORD}}"
        --admin-email "{{.ADMIN_EMAIL}}"
        --cors-origins "{{.CORS_ORIGINS}}"
        --log-level "{{.SERVER_LOG_LEVEL}}"
        --log-format "{{.SERVER_LOG_FORMAT}}"

  backend:debug:
    desc: Start gardend with debug logs and JSONL debug output
    aliases: ["server:debug", "api:debug"]
    cmds:
      - >-
        go run ./cmd/gardend serve
        --data-dir "{{.DATA_DIR}}"
        --listen "{{.LISTEN}}"
        --jwt-secret "{{.JWT_SECRET}}"
        --admin-username "{{.ADMIN_USERNAME}}"
        --admin-password "{{.ADMIN_PASSWORD}}"
        --admin-email "{{.ADMIN_EMAIL}}"
        --cors-origins "{{.CORS_ORIGINS}}"
        --log-level debug
        --log-format "{{.SERVER_LOG_FORMAT}}"
        --debug-dir "{{.DEBUG_DIR}}"

  backend:debug-logs:
    desc: Alias for backend:debug
    aliases: ["server:debug-logs", "api:debug-logs"]
    cmds:
      - task: backend:debug

  test:
    desc: Run all tests
    cmds:
      - go test -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  proto-gen:
    desc: Generate Go code from proto
    cmds:
      - buf generate

  proto-gen-web:
    desc: Generate TypeScript code from proto
    cmds:
      - buf generate --template buf.gen.web.yaml

  frontend:deps:
    desc: Install frontend dependencies
    aliases: [web-deps]
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  frontend:
    desc: Start Next.js dev server
    aliases: [web, web-dev]
    deps: [frontend:deps]
    dir: web
    env:
      NEXT_PUBLIC_API_URL: '{{.API_URL}}'
    cmds:
      - pnpm dev --hostname {{.FRONTEND_HOST}} --port {{.FRONTEND_PORT}}

  frontend:build:
    desc: Build Next.js for production
    aliases: [web-build]
    deps: [frontend:deps]
    dir: web
    env:
      NEXT_PUBLIC_API_URL: '{{.API_URL}}'
    cmds:
      - pnpm build

  frontend:lint:
    desc: Run frontend lint
    aliases: [web-lint]
    deps: [frontend:deps]
    dir: web
    cmds:
      - pnpm lint

  dev:
    desc: Start backend and frontend together
    deps:
      - task: backend
      - task: frontend

  dev:debug:
    desc: Start backend in debug-log mode and frontend together
    deps:
      - task: backend:debug
      - task: frontend

  check:
    desc: Run backend tests, Go vet/lint, and frontend lint/build
    cmds:
      - task: test
      - task: vet
      - task: lint
      - task: frontend:lint
      - task: frontend:build

  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: rd /s /q bin
        platforms: [windows]
      - cmd: rm -rf bin
        platforms: [linux, darwin]

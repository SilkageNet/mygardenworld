syntax = "proto3";

package mygardenworld.v1;

// Controls whether the redeem worker may create a game session for an
// otherwise offline account. An unspecified value is normalized to AUTO so
// existing and newly created policies preserve the established behavior.
enum RedeemConnectMode {
  REDEEM_CONNECT_MODE_UNSPECIFIED = 0;
  REDEEM_CONNECT_MODE_AUTO = 1;
  REDEEM_CONNECT_MODE_ONLINE_ONLY = 2;
}

// Policy is the full automation configuration for one game account. It is
// stored as one protojson blob and intentionally models the strategy/settings
// surface, not the account system.
message Policy {
  bool automation_enabled = 1;

  BasicPolicy basic = 2;
  PlantPolicy plant = 3;
  OrderPolicy order = 4;
  UnionPolicy union = 5;
  ActivityPolicy activity = 6;

  // Seconds between decision ticks. Default 4.
  double decision_interval_seconds = 7;

  // Exact policy document schema. Clients must send the current version;
  // persisted documents are upgraded only by explicit database migrations.
  uint32 schema_version = 8;
}

message BasicPolicy {
  ReputationPolicy reputation = 1;
  double reconnect_interval_seconds = 2;
  bool item_log_enabled = 3;
  BasicTaskPolicy task = 4;
  bool map_event_enabled = 5;
  bool mail_enabled = 6;
  BenefitPolicy benefit = 7;
  SignPolicy sign = 8;
  PearlPolicy pearl = 9;
  ShopPolicy shop = 10;
  ZooPolicy zoo = 11;

  // Resource claim settings kept in the basic category because they create
  // usable water drops; plant.planting controls whether drops are spent.
  bool waterwheel_enabled = 12;
  bool free_water_enabled = 13;
  int32 water_claim_threshold = 14;
  bool road_grow_reward_enabled = 15;

  // Allows an explicit displaced-session signal to keep the runner alive and
  // perform a fresh login after reconnect_interval_seconds. Disabled by
  // default; ordinary session expiry never uses this recovery path.
  bool displaced_session_relogin_enabled = 16;

  // AUTO may start this account to process its pending redeem codes.
  // ONLINE_ONLY never creates a session; pending codes wait until the account
  // is already online for another reason.
  RedeemConnectMode redeem_connect_mode = 17;
}

message ReputationPolicy {
  bool enabled = 1;
  int32 threshold = 2;
}

message BasicTaskPolicy {
  bool main_enabled = 1;
  bool daily_enabled = 2;
  bool weekly_enabled = 3;
  bool story_enabled = 4;
  bool achievement_enabled = 5;
}

message BenefitPolicy {
  bool double_coin_enabled = 1;
  bool box_enabled = 2;
  bool share_reward_enabled = 3;
  bool anti_scam_box_enabled = 4;
}

message SignPolicy {
  bool daily_enabled = 1;
  bool patch_enabled = 2;
}

message PearlPolicy {
  bool free_enabled = 1;
  bool auto_hire_enabled = 2;
  int32 max_hire_level = 3;
  // Max concurrent in-shift laborers. 0 disables automatic hiring.
  int32 max_hire_ticket_usage = 4;
  bool draw_enabled = 5;
  bool protect_enabled = 6;
  bool auto_buy_hire_ticket = 7;
  int64 max_spend_diamond = 8;
  // Max hire tickets (item 1003) spent since 00:00 Asia/Shanghai. 0 means unlimited.
  int32 daily_hire_ticket_limit = 9;
}

message ShopPolicy {
  bool video_free_gift_enabled = 1;
  ShopBuyPolicy cultivate_shop = 2;
  VipShopPolicy vip_shop = 3;
}

message ShopBuyPolicy {
  bool auto_buy = 1;
  int64 max_spend_gold = 2;
  int64 max_spend_diamond = 3;
  repeated int32 item_ids = 4;
}

message VipShopPolicy {
  bool auto_buy = 1;
  int64 max_spend_diamond = 2;
  int64 max_spend_floral_coin = 3;
  repeated int32 item_ids = 4;
}

message ZooPolicy {
  bool enabled = 1;
  bool auto_event_enabled = 2;
  bool auto_buy_food = 3;
  bool auto_feed = 4;
  bool auto_stroke = 5;
  int64 max_spend_gold = 6;
  int64 max_spend_diamond = 7;
}

message PlantPolicy {
  CultivatePolicy cultivate = 1;
  PlantingPolicy planting = 2;
  FriendStealPolicy friend_steal = 3;
  FlowerElvesPolicy elves = 4;
  FlowerMarketPolicy market = 5;
}

message CultivatePolicy {
  bool enabled = 1;
  bool video_speed_up_enabled = 2;
  bool upgrade_enabled = 3;
  int32 target_level = 4;
}

message PlantingPolicy {
  bool auto_enabled = 1;
  bool auto_unlock_land = 2;
  bool auto_harvest_enabled = 3;
  int32 min_water_drops = 4;

  bool video_speed_up_enabled = 5;
  bool use_speed_up_ticket = 6;
  int32 speed_up_ticket_max = 7;

  map<string, int32> demand_priority = 8;
  // When false (default), empty-land planting uses autonomous replant only.
  // When true, missing flowers for enabled tasks/orders claim empty land first,
  // ordered by demand_priority, then autonomous replant fills any remainder.
  bool demand_priority_enabled = 9;

  // These fields only limit autonomous empty-land replanting. Demand-driven
  // planting for enabled tasks/orders always uses the required flower.
  SelectionMode auto_replant_mode = 10;
  repeated int32 auto_replant_flower_ids = 11;
  repeated int32 auto_replant_exclude_flower_ids = 12;
  // When auto_replant_mode is ALL, empty list means every quality (凡普珍华仙).
  // Otherwise only the selected qualities are eligible for autonomous replanting.
  repeated int32 auto_replant_qualities = 13;
  // Minimum cultivate level for autonomous empty-land replanting. 0 means no
  // level filter. When set (e.g. 11), only flowers at that level or above are
  // planted (through FlowerMaxLevel, typically 20). Does not restrict
  // demand-driven planting for tasks/orders.
  int32 auto_replant_min_level = 14;

  // Seconds to wait after a plant becomes harvestable before auto-harvest.
  // 0 means harvest as soon as ready (state=3 immediately; state=2 still uses
  // the short protocol ready grace). Does not affect manual harvest.
  // Guild-race plant-harvest flowers always ignore this delay (harvest ASAP)
  // while an unfinished race task is held, even when auto_harvest_enabled is off.
  int32 harvest_delay_seconds = 15;
}

message FriendStealPolicy {
  bool enabled = 1;
  bool steal_elves = 2;
  SelectionMode mode = 3;
  repeated int32 qualities = 4;
  repeated int32 flower_ids = 5;
  repeated int32 exclude_flower_ids = 6;
  bool auto_buy_times = 7;

  // Friend selection is separate from mode, which selects flower types.
  // Only ALL and SPECIFIC are accepted here.
  SelectionMode friend_mode = 8;
  map<int64, int32> friend_counts = 9;
  repeated int64 exclude_uids = 10;
  // Maximum friendship-coin purchases per friend. 0 uses the catalog limit.
  int32 max_buy_per_friend = 11;
}

message FlowerElvesPolicy {
  bool enabled = 1;
  repeated int32 selected_ids = 2;
  bool request_aid = 3;
  bool receive_aid = 4;
  bool help_friend = 5;
  bool dispatch = 6;
  bool dispatch_only_double_buff = 7;
  bool speed_up_dispatch = 8;
  bool receive_dispatch_reward = 9;
  bool pass_reward_enabled = 10;
  bool pass_task_reward_enabled = 11;
  bool flower_pass_reward_enabled = 12;
  bool flower_pass_task_reward_enabled = 13;
  int64 max_spend_diamond = 14;
}

message FlowerMarketPolicy {
  bool auto_unlock_shelf = 1;
  bool put_enabled = 2;
  MarketPutMode put_mode = 3;
  repeated int32 specific_flower_ids = 4;
  int32 price_index = 5;
  int32 max_sell = 6;
  string put_flower_password = 7;
  bool auto_buy_from_friend = 8;
  MarketBuyMode buy_mode = 9;
  repeated int32 buy_specific_flower_ids = 10;
  repeated int32 buy_qualities = 11;
  int32 min_put_time_seconds = 12;
  int64 max_spend_diamond = 13;
  int64 max_spend_gold = 14;
}

enum SelectionMode {
  SELECTION_MODE_UNSPECIFIED = 0;
  SELECTION_MODE_ALL = 1;
  SELECTION_MODE_QUALITY = 2;
  SELECTION_MODE_SPECIFIC = 3;
  SELECTION_MODE_EXCLUDE = 4;
}

enum MarketPutMode {
  MARKET_PUT_MODE_UNSPECIFIED = 0;
  MARKET_PUT_MODE_INVENTORY = 1;
  MARKET_PUT_MODE_SPECIFIC = 2;
}

enum MarketBuyMode {
  MARKET_BUY_MODE_UNSPECIFIED = 0;
  MARKET_BUY_MODE_ALL = 1;
  MARKET_BUY_MODE_SPECIFIC = 2;
  MARKET_BUY_MODE_QUALITY = 3;
}

message OrderPolicy {
  CustomerOrderPolicy customer = 1;
  ResidentOrderPolicy resident = 2;
  PalaceOrderPolicy palace = 3;
  TeamOrderPolicy team = 4;
  FlowerArtPolicy flower_art = 5;
}

message CustomerOrderPolicy {
  bool enabled = 1;
  bool reject_unavailable_enabled = 2;
  // Daily finish cap from namespace-124 orderCustomerFinishNum. 0 means unlimited.
  int32 daily_limit = 3;
  // Minimum flower-art piece count to accept. Orders below this are rejected.
  // 0 means no filter; 2 accepts 2+ arts; 3 accepts only 3+ arts.
  int32 min_flower_art_count = 4;
}

message ResidentOrderPolicy {
  bool normal_enabled = 1;
  int32 normal_daily_limit = 2;
  bool decorate_enabled = 3;
  int32 decorate_daily_limit = 4;
  bool satin_enabled = 5;
  int32 satin_daily_limit = 6;
  repeated int32 qualities = 7;
  bool reward_enabled = 8;
}

message PalaceOrderPolicy {
  bool enabled = 1;
  repeated int32 qualities = 2;
}

message TeamOrderPolicy {
  bool enabled = 1;
  bool one_more_enabled = 2;
  bool submit_only_cultivated = 3;
  repeated int32 qualities = 4;
  int64 max_spend_diamond = 5;
}

message FlowerArtPolicy {
  bool auto_unlock_stand = 1;
  bool sell_enabled = 2;
  bool craft_enabled = 3;
  bool early_cancel_enabled = 4;
  bool create_reward_enabled = 5;
  bool collect_reward_enabled = 6;
  // When true together with sell_enabled, skip auto listing (and rack craft for
  // listing) during 00:00-08:00 Asia/Shanghai. Claiming rack proceeds still runs.
  bool sell_night_pause_enabled = 7;
  // Preferred finished flower-art ids to list on the rack. Only arts whose vase
  // is unlocked are considered. Empty means list the finished art with the
  // highest inventory count among unlocked-vase recipes.
  repeated int32 sell_art_ids = 8;
}

message UnionPolicy {
  UnionBuildPolicy build = 1;
  UnionFlowerPolicy flower = 2;
  UnionRacePolicy race = 3;
  UnionLandPolicy land = 4;
  bool red_packet_enabled = 5;
  bool forest_enabled = 6;
}

message UnionBuildPolicy {
  bool free_enabled = 1;
  bool gold_enabled = 2;
  bool diamond_enabled = 3;
  int64 max_spend_gold = 4;
  int64 max_spend_diamond = 5;
}

message UnionFlowerPolicy {
  bool share_enabled = 1;
  SelectionMode share_mode = 2;
  repeated int32 share_qualities = 3;
  repeated int32 share_flower_ids = 4;
  bool take_enabled = 5;
  SelectionMode take_mode = 6;
  repeated int32 take_qualities = 7;
  repeated int32 take_flower_ids = 8;
}

message UnionRacePolicy {
  bool enabled = 1;
  bool auto_enable_modules = 2;
  bool use_speedup_ticket_in_task = 3;
  // Task score lower bound. Tasks with Score <= this value are skipped during
  // selection. 0 means no score filtering.
  int32 min_task_score = 4;
  // When true, only already-upgraded tasks (IsUpgrade != 0) are eligible for
  // selection. Upgraded tasks carry bonus score multipliers.
  bool only_upgrade_task = 5;
  bool exclude_others_upgrade_task = 6;
  map<int32, int32> task_type_priority = 7;
  // Independently upgrades the current unfinished task, subject to a known
  // cost and max_spend_diamond. Does not require auto_enable_modules.
  bool upgrade_task = 8;
  bool delete_low_score_task = 9;
  int32 delete_task_max_score = 10;
  // Per-task upgrade cost ceiling. Zero prohibits spending; never unlimited.
  int64 max_spend_diamond = 11;
  // When true with auto_enable_modules, stop planning takeTask once this
  // batch's free task quota is used up (finished_task_num >= total_task_num).
  // Sync / finish / giveUp of an already-held task still run. Default on in
  // DefaultPolicy; purchased extra slots (buyTaskNum) are not consumed.
  bool auto_stop_on_quota_done = 12;
  // When true, the race monitor shows personal cumulative score and guild-member
  // rank for the current batch. Default off.
  bool show_personal_score_rank = 13;
  // Skip unclaimed pool tasks whose observed finish_cnt is greater than zero.
  // Presence distinguishes the default-on policy from an explicit false.
  optional bool avoid_progressed_tasks = 14;
  // Automatically give up an unfinished held task when it violates the current
  // score/type filters or cannot be progressed. This also applies to tasks
  // taken outside gardend, so it is an explicit opt-in independent of
  // auto_enable_modules. Default off.
  bool auto_give_up_task = 15;
  // Account-wide minimum spacing between delete attempts, including manual
  // deletion and its preflight refresh. Zero uses 120 seconds; clamped to
  // 30..3600 seconds. This is a conservative local guard, not a server limit.
  int32 delete_interval_seconds = 16;
}

message UnionLandPolicy {
  bool harvest_enabled = 1;
  bool auto_plant_enabled = 2;
  repeated int32 qualities = 3;
  repeated int32 flower_ids = 4;
  int32 max_flower_level = 5;
  // When auto-planting and every filtered plantable flower is at/above level 11,
  // only consider flowers whose catalog grow CD is at least this many minutes.
  // Below level 11, maturity is ignored when selecting the training flower.
  // 0 means default 20.
  int32 min_maturity_minutes = 6;
  // Occupied lands are replaced only after this many minutes, with no pending
  // harvest and no maturity within two minutes. This also applies while
  // training flowers below level 11. Empty slots are always filled. 0 means 60.
  int32 min_replant_minutes = 7;
}

message ActivityPolicy {
  CyclicNotePolicy cyclic_note = 1;
  CyclicStoryPolicy cyclic_story = 2;
}

message CyclicNotePolicy {
  bool enabled = 1;
  bool auto_claim_task_rewards = 2;
  bool auto_claim_progress_boxes = 3;
  bool satisfy_tasks = 4;
}

message CyclicStoryPolicy {
  bool enabled = 1;
  bool auto_claim_order_rewards = 2;
  bool auto_claim_progress_boxes = 3;
  int64 max_score = 4;
}

syntax = "proto3";

package mygardenworld.v1;

import "google/protobuf/timestamp.proto";
import "mygardenworld/v1/account.proto";
import "mygardenworld/v1/channel.proto";
import "mygardenworld/v1/policy.proto";
import "mygardenworld/v1/workspace_activity.proto";
import "mygardenworld/v1/workspace_basic.proto";
import "mygardenworld/v1/workspace_common.proto";
import "mygardenworld/v1/workspace_garden.proto";
import "mygardenworld/v1/workspace_orders.proto";
import "mygardenworld/v1/workspace_union.proto";
import "mygardenworld/v1/workspace_warehouse.proto";

// WorkspaceDomain is the product boundary used by state patches and the Web UI.
enum WorkspaceDomain {
  WORKSPACE_DOMAIN_UNSPECIFIED = 0;
  WORKSPACE_DOMAIN_BASIC = 1;
  WORKSPACE_DOMAIN_GARDEN = 2;
  WORKSPACE_DOMAIN_ORDERS = 3;
  WORKSPACE_DOMAIN_UNION = 4;
  WORKSPACE_DOMAIN_ACTIVITIES = 5;
  WORKSPACE_DOMAIN_WAREHOUSE = 6;
  WORKSPACE_DOMAIN_STATISTICS = 7;
}

enum WorkspaceLogPageKind {
  WORKSPACE_LOG_PAGE_KIND_UNSPECIFIED = 0;
  WORKSPACE_LOG_PAGE_KIND_RECENT = 1;
  WORKSPACE_LOG_PAGE_KIND_BEFORE = 2;
  WORKSPACE_LOG_PAGE_KIND_AFTER = 3;
  WORKSPACE_LOG_PAGE_KIND_LIVE = 4;
}

enum AccountRedeemAttemptStatus {
  ACCOUNT_REDEEM_ATTEMPT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_PENDING = 1;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_RUNNING = 2;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_SUCCESS = 3;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_ALREADY_REDEEMED = 4;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_EXPIRED = 5;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_INVALID = 6;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_RETRYABLE = 7;
  ACCOUNT_REDEEM_ATTEMPT_STATUS_UNKNOWN = 8;
}

enum AccountRedeemAttemptFilter {
  ACCOUNT_REDEEM_ATTEMPT_FILTER_UNSPECIFIED = 0;
  ACCOUNT_REDEEM_ATTEMPT_FILTER_ALL = 1;
  ACCOUNT_REDEEM_ATTEMPT_FILTER_REDEEMED = 2;
  ACCOUNT_REDEEM_ATTEMPT_FILTER_UNAVAILABLE = 3;
  ACCOUNT_REDEEM_ATTEMPT_FILTER_ATTENTION = 4;
}

message WorkspaceClientFrame {
  uint64 request_id = 1;

  oneof payload {
    OpenWorkspace open = 2;
    SelectWorkspaceAccount select_account = 3;
    ResyncWorkspace resync = 4;
    LoadWorkspaceLogs load_logs = 5;
    WatchAlipayLogin watch_alipay_login = 6;
    LoadAccountRedeemAttempts load_redeem_attempts = 7;
  }
}

message OpenWorkspace {
  uint32 protocol_version = 1;
  string access_token = 2;
  int64 selected_account_id = 3;
  int64 after_log_id = 4;
}

message SelectWorkspaceAccount {
  int64 account_id = 1;
  int64 after_log_id = 2;
}

message ResyncWorkspace {
  int64 after_log_id = 1;
}

message LoadWorkspaceLogs {
  int64 account_id = 1;
  int64 before_id = 2;
  int32 limit = 3;
}

message WatchAlipayLogin {
  string login_id = 1;
}

message LoadAccountRedeemAttempts {
  int64 account_id = 1;
  int64 before_id = 2;
  int32 limit = 3;
  AccountRedeemAttemptFilter filter = 4;
}

message WorkspaceServerFrame {
  uint64 sequence = 1;
  uint64 request_id = 2;

  oneof payload {
    WorkspaceReady ready = 3;
    AccountStatusBatch account_statuses = 4;
    WorkspaceSnapshot snapshot = 5;
    WorkspacePatch patch = 6;
    WorkspaceLogPage logs = 7;
    AlipayLoginProgress alipay_login = 8;
    WorkspaceError error = 9;
    AccountRedeemAttemptPage redeem_attempts = 10;
  }
}

message WorkspaceReady {
  uint32 protocol_version = 1;
  google.protobuf.Timestamp server_time = 2;
  repeated AccountStatus accounts = 3;
  repeated FeatureCapability feature_capabilities = 4;
  int32 heartbeat_seconds = 5;
  string server_version = 6;
}

message AccountStatusBatch {
  repeated AccountStatus accounts = 1;
}

message WorkspaceState {
  uint64 revision = 1;
  int64 account_id = 2;
  AccountStatus account_status = 3;
  Policy policy = 4;
  BasicView basic = 5;
  GardenView garden = 6;
  OrdersView orders = 7;
  UnionView union = 8;
  ActivitiesView activities = 9;
  WarehouseView warehouse = 10;
  WorkspaceStatistics statistics = 11;
}

message WorkspaceSnapshot {
  WorkspaceState state = 1;
  WorkspaceLogPage logs = 2;
}

// Message presence means that domain changed. An absent field is unchanged.
message WorkspacePatch {
  uint64 revision = 1;
  int64 account_id = 2;
  AccountStatus account_status = 3;
  Policy policy = 4;
  BasicView basic = 5;
  GardenView garden = 6;
  OrdersView orders = 7;
  UnionView union = 8;
  ActivitiesView activities = 9;
  WarehouseView warehouse = 10;
  WorkspaceStatistics statistics = 11;
  repeated WorkspaceDomain cleared_domains = 12;
}

message WorkspaceStatistics {
  RuntimeStatisticsView runtime_statistics = 1;
  BusinessStatisticsView business_statistics = 2;
}

// WorkspaceLogPage is the only log transport shape. Events are always ordered
// newest first. AFTER pages are selected oldest-first in storage before being
// reversed for transport, so reconnect catch-up can never skip an intermediate
// page even when more_after is true.
message WorkspaceLogPage {
  int64 account_id = 1;
  WorkspaceLogPageKind kind = 2;
  repeated Event events = 3;
  int64 next_before_id = 4;
  bool has_more_before = 5;
  bool has_more_after = 6;
  bool gap_detected = 7;
}

message AccountRedeemAttempt {
  int64 id = 1;
  string code = 2;
  Channel channel = 3;
  AccountRedeemAttemptStatus status = 4;
  string message = 5;
  int32 attempt_count = 6;
  google.protobuf.Timestamp attempted_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message AccountRedeemAttemptSummary {
  int64 total = 1;
  int64 success = 2;
  int64 already_redeemed = 3;
  int64 expired = 4;
  int64 invalid = 5;
  int64 pending = 6;
  int64 running = 7;
  int64 retryable = 8;
  int64 unknown = 9;
}

message AccountRedeemAttemptPage {
  int64 account_id = 1;
  AccountRedeemAttemptFilter filter = 2;
  repeated AccountRedeemAttempt entries = 3;
  int64 next_before_id = 4;
  bool has_more_before = 5;
  AccountRedeemAttemptSummary summary = 6;
  bool replace = 7;
}

message AlipayLoginProgress {
  string login_id = 1;
  AlipayLoginStatus status = 2;
  Account account = 3;
  string login_error = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message WorkspaceError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

syntax = "proto3";

package mygardenworld.v1;

service AutomationService {
  // Enables the automation loop on the account. Equivalent to setting
  // policy.automation_enabled = true and waking the runner.
  rpc EnableAutomation(EnableAutomationRequest) returns (EnableAutomationResponse);

  // Disables the automation loop. WS connection stays up and state tracking
  // continues; only mutating RPCs are suppressed.
  rpc DisableAutomation(DisableAutomationRequest) returns (DisableAutomationResponse);

  // Takes one currently eligible guild-race task immediately. The runner
  // applies the same observed-state and policy gates as automatic selection;
  // this never bypasses the server's appear-time cooldown.
  rpc TakeUnionRaceTask(TakeUnionRaceTaskRequest) returns (TakeUnionRaceTaskResponse);

  // Deletes one user-selected, currently unclaimed guild-race task. This is
  // an explicit management action and therefore does not use the automatic
  // low-score threshold, but still requires fresh membership and permission
  // evidence from the current race cycle.
  rpc DeleteUnionRaceTask(DeleteUnionRaceTaskRequest) returns (DeleteUnionRaceTaskResponse);
}

message EnableAutomationRequest {
  int64 account_id = 1;
}

message EnableAutomationResponse {}

message DisableAutomationRequest {
  int64 account_id = 1;
}

message DisableAutomationResponse {}

message TakeUnionRaceTaskRequest {
  int64 account_id = 1;
  int64 task_ms_id = 2;
}

message TakeUnionRaceTaskResponse {}

message DeleteUnionRaceTaskRequest {
  int64 account_id = 1;
  int64 task_ms_id = 2;
}

message DeleteUnionRaceTaskResponse {}

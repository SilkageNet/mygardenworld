syntax = "proto3";

package mygardenworld.v1;

// Channel identifies the gfsdk distribution / platform variant we should
// impersonate when talking to the babigame backend. Different channels can
// hit different host fronts, ship different version pinning, and require
// different signing fingerprints (for example Alipay vs iOS App Store).
// Pick at account creation time; the daemon
// resolves the wire-level Config from this on every login.
enum Channel {
  // Default zero. Reject at the API boundary; we never auto-pick.
  CHANNEL_UNSPECIFIED = 0;

  // The official iOS App Store build (cn.lbwdhysj.gf.ios). Captured and
  // verified, May 2026.
  CHANNEL_IOS = 1;

  // Alipay mini-game channel (cn.hysj.zfb.minigame). Account binding uses
  // the AccountService QR flow; username/password creation is not accepted.
  CHANNEL_ALIPAY = 2;

  // Add another channel only after its complete login flow has a verified capture.
}

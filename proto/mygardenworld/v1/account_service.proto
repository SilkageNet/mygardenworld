syntax = "proto3";

package mygardenworld.v1;

import "google/protobuf/timestamp.proto";
import "mygardenworld/v1/account.proto";
import "mygardenworld/v1/channel.proto";

service AccountService {
  // Add an iOS game account. Verifies credentials, derives the display name,
  // persists the account, and starts its runner and automation.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);

  // Soft-delete: stops the runner and removes the row + sessions/policies.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Force a fresh username+password login for the account. Refreshes
  // session token, routeToken, gsHost. Daemon will rebuild the WS.
  rpc ConnectAccount(ConnectAccountRequest) returns (ConnectAccountResponse);

  // Starts a short-lived Alipay PC game-center QR authorization. The returned
  // qr_content must be rendered locally as a QR code and is never persisted.
  rpc StartAlipayLogin(StartAlipayLoginRequest) returns (StartAlipayLoginResponse);

  // Stops the live runner/WS for the account and disables auto-resume.
  // Credentials stay stored; the account can be logged in again later.
  rpc DisconnectAccount(DisconnectAccountRequest) returns (DisconnectAccountResponse);

  // Redeem one gift code across an explicit set of accounts from one channel.
  // Offline accounts are started first so the game RPC can run.
  rpc RedeemCode(RedeemCodeRequest) returns (RedeemCodeResponse);
}

message CreateAccountRequest {
  string username = 1;
  string password = 2;
  // Required: distribution channel we should impersonate. CHANNEL_IOS today.
  Channel channel = 3;
}

message CreateAccountResponse {
  Account account = 1;
  // Populated only when the account was persisted but its runner could not be
  // started or automation could not be enabled.
  string login_error = 2;
}

message DeleteAccountRequest {
  int64 id = 1;
}

message DeleteAccountResponse {}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message ConnectAccountRequest {
  int64 id = 1;
}

message ConnectAccountResponse {
  Account account = 1;
  google.protobuf.Timestamp logged_in_at = 2;
}

message StartAlipayLoginRequest {}

message StartAlipayLoginResponse {
  string login_id = 1;
  string qr_content = 2;
  google.protobuf.Timestamp expires_at = 3;
  AlipayLoginStatus status = 4;
}

message DisconnectAccountRequest {
  int64 id = 1;
}

message DisconnectAccountResponse {
  Account account = 1;
}

message RedeemCodeRequest {
  // Gift / redeem code from the game.
  string code = 1;
  // Required target account ids. Every account must belong to the same channel.
  repeated int64 account_ids = 2;
}

message RedeemCodeResponse {
  repeated RedeemCodeResult results = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
}

message RedeemCodeResult {
  int64 account_id = 1;
  string account_name = 2;
  bool ok = 3;
  string message = 4;
}

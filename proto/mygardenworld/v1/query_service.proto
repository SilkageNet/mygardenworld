syntax = "proto3";

package mygardenworld.v1;

import "mygardenworld/v1/query_activity.proto";
import "mygardenworld/v1/query_assets.proto";
import "mygardenworld/v1/query_common.proto";
import "mygardenworld/v1/query_garden.proto";
import "mygardenworld/v1/query_orders.proto";
import "mygardenworld/v1/query_overview.proto";
import "mygardenworld/v1/query_union.proto";

service QueryService {
  // Lightweight summary: connected accounts and inventory totals. For dashboard polling.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetFeatureCapabilities(GetFeatureCapabilitiesRequest) returns (GetFeatureCapabilitiesResponse);

  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc GetGarden(GetGardenRequest) returns (GetGardenResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  rpc GetUnion(GetUnionRequest) returns (GetUnionResponse);
  rpc GetActivities(GetActivitiesRequest) returns (GetActivitiesResponse);
  rpc GetAssets(GetAssetsRequest) returns (GetAssetsResponse);

  // Stream of every event the runner emits (analogous to the Python bot's
  // JSONL log). Supports filter + per-account scoping.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
}

message GetStatusRequest {
  // Zero = all accounts.
  int64 account_id = 1;
}

message GetStatusResponse {
  repeated AccountStatus accounts = 1;
}

message GetFeatureCapabilitiesRequest {}

message GetFeatureCapabilitiesResponse {
  repeated FeatureCapability feature_capabilities = 1;
}

message GetOverviewRequest {
  int64 account_id = 1;
}

message GetOverviewResponse {
  OverviewView overview = 1;
}

message GetGardenRequest {
  int64 account_id = 1;
}

message GetGardenResponse {
  GardenView garden = 1;
}

message GetOrdersRequest {
  int64 account_id = 1;
}

message GetOrdersResponse {
  OrdersView orders = 1;
}

message GetUnionRequest {
  int64 account_id = 1;
}

message GetUnionResponse {
  UnionView union = 1;
}

message GetActivitiesRequest {
  int64 account_id = 1;
}

message GetActivitiesResponse {
  ActivitiesView activities = 1;
}

message GetAssetsRequest {
  int64 account_id = 1;
}

message GetAssetsResponse {
  AssetsView assets = 1;
}

syntax = "proto3";

package mygardenworld.v1;

import "google/protobuf/timestamp.proto";

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_READY = 1;
  PLAN_STATUS_MANAGED = 2;
  PLAN_STATUS_SYNC_ONLY = 3;
  PLAN_STATUS_ADAPTER_MISSING = 4;
  PLAN_STATUS_BLOCKED = 5;
  PLAN_STATUS_SKIPPED = 6;
}

enum GateResourceKind {
  GATE_RESOURCE_KIND_UNSPECIFIED = 0;
  GATE_RESOURCE_KIND_GOLD = 1;
  GATE_RESOURCE_KIND_DIAMOND = 2;
  GATE_RESOURCE_KIND_ITEM = 3;
  GATE_RESOURCE_KIND_WATER_DROP = 4;
  GATE_RESOURCE_KIND_LEVEL = 5;
  GATE_RESOURCE_KIND_VASE = 6;
  GATE_RESOURCE_KIND_POLICY = 7;
  GATE_RESOURCE_KIND_STATE = 8;
  GATE_RESOURCE_KIND_ADAPTER = 9;
  // Activity-local namespace-23 inventory. This must never fall back to the
  // normal namespace-7 item inventory.
  GATE_RESOURCE_KIND_ACTIVITY_ITEM = 10;
}

enum ExecutionLane {
  EXECUTION_LANE_UNSPECIFIED = 0;
  EXECUTION_LANE_FARM = 1;
  EXECUTION_LANE_SIDE = 2;
}

service QueryService {
  // Lightweight summary: connected accounts and inventory totals. For dashboard polling.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Full per-account snapshot: all known lands with state + recommendation,
  // inventory map for the seed range, role identity.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);

  // Stream of every event the runner emits (analogous to the Python bot's
  // JSONL log). Supports filter + per-account scoping.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
}

message GetStatusRequest {
  // Empty = all accounts.
  string account_id = 1;
  string account_name = 2;
  // Static capabilities are only needed during Web initialization. Polling
  // callers leave this false to keep the status response lightweight.
  bool include_feature_capabilities = 3;
}

message GetStatusResponse {
  repeated AccountStatus accounts = 1;
  // Static product capabilities from automation.FeatureCatalog. These are
  // response-scoped because every account shares the same catalog.
  repeated FeatureCapability feature_capabilities = 2;
}

message AccountStatus {
  string account_id = 1;
  string account_name = 2;
  // Live runtime state: true only while the daemon currently holds a WS.
  bool connected = 3;
  google.protobuf.Timestamp last_event_at = 4;
  int32 known_lands = 5;
  // Recommendation kind histogram: harvest=N, plant=N, water=N, wait=N, ...
  map<string, int32> by_kind = 7;
  int32 flower_stock_total = 8;
  // Persisted user intent: true when automation should run once the account is started.
  bool automation_enabled = 9;
  RunnerDiagnostics diagnostics = 10;
  repeated DomainStatus domain_statuses = 11;
  string health = 12;
  string last_error = 13;
  int32 level = 14;
  int32 experience = 15;
  int32 vip = 16;
  int32 vip_exp = 17;
  bool noble_eligible = 18;
  bool reputation_observed = 19;
  int32 reputation_score = 20;
  int64 reputation_last_sync_time_ms = 21;
  int64 reputation_last_view_time_ms = 22;
  RuntimeStatisticsView runtime_statistics = 23;
  // Remaining within-level XP to advance; 0 when maxed or unknown.
  int32 experience_to_next_level = 24;
  // c_lvl[level].exp requirement for the current level; 0 when maxed.
  int32 next_level_experience = 25;
  bool level_maxed = 26;
  // Last-known game-server idx. This is included in the polled runtime view
  // so the Web UI does not need to re-list accounts after the first login.
  int32 gs_idx = 27;
}

message RunnerDiagnostics {
  string current_operation = 1;
  google.protobuf.Timestamp current_operation_started_at = 2;
  string last_operation = 3;
  google.protobuf.Timestamp last_operation_at = 4;
  string last_operation_error = 5;
  google.protobuf.Timestamp last_operation_error_at = 6;
  google.protobuf.Timestamp next_decision_at = 7;
  string session_invalidated_reason = 10;
  repeated string blocked_reasons = 11;
  int32 unknown_rpc_count = 12;
  int32 unknown_namespace_count = 13;
  repeated string observed_namespaces = 14;
}

message GetSnapshotRequest {
  string account_id = 1;
  string account_name = 2;
}

message GetSnapshotResponse {
  string account_id = 1;
  string account_name = 2;
  repeated LandView lands = 3;
  // 7.0.32 sub-map: inventory itemId -> count.
  map<int32, int32> inventory = 4;
  int64 role_id = 5;
  string role_name = 6;
  google.protobuf.Timestamp captured_at = 7;

  // Player resources (top-level fields from namespace 7.0).
  int32 gold = 8;
  int32 water_drops = 9;
  int32 water_drops_total = 10;
  int64 water_drops_next_ms = 11;
  int32 level = 12;
  int32 experience = 13;
  int32 diamonds_free = 14;
  int32 diamonds_paid = 15;
  repeated PendingTaskView pending_tasks = 16;
  int32 vip = 17;
  int32 vip_exp = 18;
  bool noble_eligible = 19;
  repeated string observed_namespaces = 20;
  int32 unknown_rpc_count = 21;
  int32 unknown_namespace_count = 22;
  RunnerDiagnostics diagnostics = 23;
  repeated DomainStatus domain_statuses = 24;
  repeated PlannedOperation planned_operations = 25;
  repeated DemandView demands = 26;
  repeated VaseView vases = 28;
  repeated FlowerArtAvailabilityView flower_art_availability = 29;
  OrderStatisticsView order_statistics = 30;
  InventoryLedgerView inventory_ledger = 31;
  BlockingSummary blocking_summary = 32;
  bool reputation_observed = 33;
  int32 reputation_score = 34;
  int64 reputation_last_sync_time_ms = 35;
  int64 reputation_last_view_time_ms = 36;
  repeated PlantableFlowerView plantable_flowers = 37;
  RuntimeStatisticsView runtime_statistics = 38;
  CyclicNoteView cyclic_note = 39;
  FmlRaceView fml_race = 40;
  DessertView dessert = 41;
  CyclicStoryView cyclic_story = 42;
  // Remaining within-level XP to advance; 0 when maxed or unknown.
  int32 experience_to_next_level = 43;
  // c_lvl[level].exp requirement for the current level; 0 when maxed.
  int32 next_level_experience = 44;
  bool level_maxed = 45;
  // Guild land planting state from namespace 25.102 (fmlLand.landMap).
  repeated FmlLandView fml_lands = 46;
  // True after 25.102 has been observed for this account session.
  bool fml_lands_observed = 47;
}

message CyclicNoteView {
  bool observed = 1;
  bool found = 2;
  int32 batch_id = 3;
  int32 template_id = 4;
  int32 template_type = 5;
  int32 status = 6;
  // Client-compatible activity phase: 0 before preview/unknown, 1 preview, 2 active,
  // 3 reward grace period, 4 ended.
  int32 phase = 7;
  int64 phase_end_ms = 8;
  int64 begin_ms = 9;
  int64 visible_start_ms = 10;
  int64 end_ms = 11;
  int64 grace_end_ms = 12;
  string name = 13;
  string description = 14;
  int32 score = 15;
  repeated ActivityItem items = 16;
  int32 currency_item_id = 17;
  int32 currency_balance = 18;
  int32 finish_count = 19;
  int64 last_refresh_ms = 20;
  repeated CyclicNoteTaskSlot tasks = 21;
  repeated CyclicNoteMilestone milestones = 22;
  // Distinguishes an initialized empty value from an activity that still
  // needs its enter response. These must not be inferred from valid/tasks.
  bool task_list_observed = 23;
  bool task_record_observed = 24;
  // Found identifies a matching batch; valid confirms its required template
  // and timing fields were decoded well enough for safe decisions.
  bool valid = 25;
  // True only after IActInfo.boxes was observed, including an observed empty
  // list. Milestone readiness must never infer "unclaimed" from absence.
  bool milestone_receipts_observed = 26;
}

message CyclicNoteTaskSlot {
  int32 slot_id = 1;
  bool unlocked = 2;
  int32 task_id = 3;
  int32 task_type = 4;
  int32 param = 5;
  string title = 6;
  int32 target = 7;
  // Progress is clamped for display. raw_progress remains the server value
  // used for completion checks.
  int32 progress = 8;
  int32 raw_progress = 9;
  bool progress_observed = 10;
  bool received = 11;
  bool receipt_observed = 12;
  bool catalog_known = 13;
  repeated ActivityItem reward = 14;
  repeated ActivityItem finish_cost = 15;
  PlanStatus status = 16;
}

message CyclicNoteMilestone {
  int32 index = 1;
  int32 target = 2;
  bool received = 3;
  repeated ActivityItem reward = 4;
  PlanStatus status = 5;
  int32 progress = 6;
  int32 raw_progress = 7;
  bool ready = 8;
}

message CyclicStoryView {
  bool observed = 1;
  bool found = 2;
  bool valid = 3;
  int32 batch_id = 4;
  int32 template_id = 5;
  int32 template_type = 6;
  int32 status = 7;
  // Client-compatible activity phase: 0 before preview/unknown, 1 preview, 2 active,
  // 3 reward grace period, 4 ended.
  int32 phase = 8;
  int64 phase_end_ms = 9;
  int64 begin_ms = 10;
  int64 visible_start_ms = 11;
  int64 end_ms = 12;
  int64 grace_end_ms = 13;
  string name = 14;
  string description = 15;
  int32 score = 16;
  repeated ActivityItem items = 17;
  int32 currency_item_id = 18;
  int32 currency_balance = 19;
  int32 finish_count = 20;
  int32 exp_order_num = 21;
  int64 last_refresh_ms = 22;
  repeated CyclicStoryOrder orders = 23;
  repeated CyclicNoteMilestone milestones = 24;
  bool orders_observed = 25;
  bool milestone_receipts_observed = 26;
}

message CyclicStoryOrder {
  int32 order_idx = 1;
  int32 order_id = 2;
  int32 flower_id = 3;
  // Server may send unix seconds or milliseconds; keep int64 for both.
  int64 order_time = 4;
  int64 valid_time = 5;
  int32 cost = 6;
  bool catalog_known = 7;
  bool on_cooldown = 8;
  repeated ActivityItem reward = 9;
  PlanStatus status = 10;
}

message FmlRaceView {
  bool observed = 1;
  bool batch_active = 2;
  FmlRaceTaken taken = 3;
  repeated FmlRaceTask tasks = 4;
  int64 batch_start_ms = 5;
  int64 batch_end_ms = 6;
  int32 batch_status = 7;
  // Local ms when task pool (NS25 field 114) was last applied.
  int64 tasks_synced_at_ms = 8;
  // True after NS25 field 110 (usr rcd) has been observed for task quota.
  bool task_quota_observed = 9;
  // Finished race tasks this batch (IFmlRaceUsrRcd.fTaskNum).
  int32 finished_task_num = 10;
  // Total race task quota: c_fmlRace(raceLvl).taskNum (甲=18, 乙=15, …).
  int32 total_task_num = 11;
  // Guild race tier used for total_task_num (甲=4, 乙=3, 丙=2, 丁=1).
  int32 race_lvl = 12;
}

message FmlRaceTask {
  int64 ms_id = 1;
  int32 task_id = 2;
  string task_label = 3;
  int32 score = 4;
  bool is_upgrade = 5;
  int64 upgrade_uid = 6;
  int32 task_type = 7;
  // Catalog name for param target (flower/item); empty when param absent.
  string target_label = 8;
  // Protocol appearTime (ms). Future value means the slot is still on CD.
  int64 appear_time_ms = 9;
  // Empty = automation would consider takeable; otherwise primary skip reason.
  string take_skip_reason = 10;
}

message FmlRaceTaken {
  bool has_task = 1;
  int64 task_ms_id = 2;
  int32 task_id = 3;
  string task_label = 4;
  int32 target_cnt = 5;
  int32 finish_cnt = 6;
  int32 score = 7;
  int32 task_type = 8;
  string target_label = 9;
  // Held-task deadline in ms (IFmlRaceTakeTask.expireTime / pool takeExpireTime).
  // 0 means unknown / not yet observed.
  int64 expire_time_ms = 10;
}

message DessertView {
  bool observed = 1;
  bool found = 2;
  bool valid = 3;
  int32 batch_id = 4;
  int32 template_id = 5;
  int32 template_type = 6;
  int32 status = 7;
  // Client-compatible activity phase: 0 before preview/unknown, 1 preview,
  // 2 active, 3 reward grace period, 4 ended.
  int32 phase = 8;
  int64 phase_end_ms = 9;
  int64 begin_ms = 10;
  int64 visible_start_ms = 11;
  int64 end_ms = 12;
  int64 grace_end_ms = 13;
  string name = 14;
  string description = 15;
  int32 drop_count = 16;
  int32 total_score = 17;
  // Activity-local inventory from namespace 23.0.<batch>.12. It must not be
  // confused with the normal namespace-7 inventory.
  repeated ActivityItem items = 18;
  int32 energy_item_id = 19;
  int32 energy_balance = 20;
  int32 currency_item_id = 21;
  int32 currency_balance = 22;
  int32 point_item_id = 23;
  int32 reward_box_item_id = 24;
  int32 reward_box_balance = 25;
  bool drop_count_observed = 26;
  bool total_score_observed = 27;
  bool bag_observed = 28;
  bool extension_observed = 29;
  bool extension_valid = 30;
  bool mode_map_observed = 31;
  bool mode_map_valid = 32;
  bool task_groups_observed = 33;
  bool task_groups_valid = 34;
  bool task_record_observed = 35;
  bool milestone_receipts_observed = 36;
  repeated DessertModeView modes = 37;
  repeated DessertTaskView tasks = 38;
  repeated DessertMilestoneView milestones = 39;
  DessertCelebrityLikeView celebrity = 40;
  // Session-local, sanitized shadow-controller diagnostics. This never
  // contains account identifiers, absolute login timestamps, or raw board
  // coordinates.
  DessertRuntimeView runtime = 41;
}

message DessertModeView {
  int32 mode = 1;
  int32 multiplier = 2;
  int32 unlock_score = 3;
  bool unlocked = 4;
  bool observed = 5;
  bool valid = 6;
  int32 step = 7;
  int32 score = 8;
  bool is_running = 9;
  // Raw is the exact server value. Effective mirrors the client's resume
  // behavior, which converts the transient stopped state (2) back to play (1).
  int32 raw_game_status = 10;
  int32 effective_game_status = 11;
  int32 current_id = 12;
  // Raw physics objects and coordinates are deliberately not public.
  int32 object_count = 13;
  repeated DessertLevelCountView level_counts = 14;
}

message DessertLevelCountView {
  int32 level = 1;
  int32 count = 2;
}

message DessertTaskView {
  int32 task_index = 1;
  int32 position = 2;
  int32 task_id = 3;
  int32 task_type = 4;
  int32 param = 5;
  bool has_param = 6;
  string title = 7;
  int32 target = 8;
  // Progress is clamped for display. raw_progress remains the authoritative
  // server value used for completion checks.
  int32 progress = 9;
  int32 raw_progress = 10;
  bool progress_observed = 11;
  bool received = 12;
  bool receipt_observed = 13;
  bool catalog_known = 14;
  repeated ActivityItem reward = 15;
  PlanStatus status = 16;
}

message DessertMilestoneView {
  int32 index = 1;
  int32 target = 2;
  bool received = 3;
  repeated ActivityItem reward = 4;
  // Milestones remain monitoring-only until the reward RPC has a sanitized
  // capture fixture, so a logically ready row is still SYNC_ONLY.
  PlanStatus status = 5;
  int32 progress = 6;
  int32 raw_progress = 7;
  bool ready = 8;
}

message DessertCelebrityLikeView {
  bool observed = 1;
  bool valid = 2;
  bool types_observed = 3;
  bool rankings_observed = 4;
  bool likes_observed = 5;
  bool type_listed = 6;
  bool ranking_observed = 7;
  int32 ranking_count = 8;
  bool liked_this_batch = 9;
  int64 last_like_time_ms = 10;
  int64 create_time_ms = 11;
  repeated ActivityItem reward = 12;
  PlanStatus status = 13;
}

message ActivityItem {
  int32 item_id = 1;
  string item_name = 2;
  int32 count = 3;
}

message LandView {
  int32 land_id = 1;
  int32 flower_id = 2;
  int32 state = 3;
  int32 lvl = 4;
  int32 harvest_cnt = 5;
  // ms since epoch; 0 = unset (server hasn't scheduled the next event).
  int64 next_time_ms = 6;
  int64 plant_time_ms = 7;
  // Local recommendation: harvest|plant|water|wait|unknown.
  string recommendation = 8;
  string reason = 9;
  // Server-resolved display state: opened|unopened|locked.
  string land_status = 10;
  // True when this land came from the live namespace 100 state. False means it
  // was filled from static client config so the UI can still render the full map.
  bool observed = 11;
  // Static c_farmLand metadata resolved by the daemon.
  int32 open_level = 12;
  repeated int32 unlock_cost = 13;
  repeated int32 wasteland = 14;
}

// FmlLandView is one guild land slot from namespace 25.102.fmlLand.landMap.
message FmlLandView {
  int32 land_id = 1;
  // Guild land growth tier (c_fmlLandLvl), not flower cultivation level.
  int32 level = 2;
  int32 flower_id = 3;
  int64 start_time_ms = 4;
  // Protocol matureFlwCnt; often stale until the client UI recalculates.
  int32 mature_flower_count = 5;
  int32 harvested_count = 6;
  int64 last_calc_time_ms = 7;
  // Unclaimed mature flowers (max of protocol delta and startTime+c_fmlLandLvl).
  int32 pending_harvest = 8;
  // c_fmlLandLvl.stock for this land level; 0 when unknown.
  int32 stock_cap = 9;
  // c_fmlLandLvl.time seconds per produced flower; 0 when unknown.
  int32 time_sec = 10;
  // Next flower maturity ms when pending_harvest==0 and stock not full; else 0.
  int64 next_mature_ms = 11;
  // Local recommendation: harvest|plant|wait|unknown.
  string recommendation = 12;
  string reason = 13;
  // Cultivation level of flower_id from namespace 101 (0 if empty/unknown).
  int32 flower_lvl = 14;
}

message PlantableFlowerView {
  int32 flower_id = 1;
  string flower_name = 2;
  int32 stock = 3;
  int32 gold = 4;
  int32 experience = 5;
  // Cultivation level from namespace 101 (0 if unknown / not yet synced).
  int32 lvl = 6;
  // Catalog grow CD in seconds at current lvl (c_flowerLvl / c_flowerLvlCfg); 0 if unknown.
  int32 cd_seconds = 7;
}

message PendingTaskView {
  // Stable category for grouping in the dashboard.
  string category = 1;
  // Server id within that category, e.g. box id, npc id, or task id.
  string id = 2;
  string title = 3;
  // Progress fields are populated for task-style entries.
  int32 finished = 4;
  int32 target = 5;
  PlanStatus status = 6;
  repeated RequirementView requirements = 7;
  int64 cooldown_until_ms = 8;
  string cooldown_reason = 9;
}

message PlannedOperation {
  string category = 1;
  string domain = 2;
  string action = 3;
  string rpc = 4;
  string reason = 5;
  repeated int32 land_ids = 6;
  int32 flower_id = 7;
  int32 priority = 8;
  int32 gold_cost = 9;
  int32 diamond_cost = 10;
  map<int32, int32> item_cost = 11;
  string feature_id = 12;
  string label = 13;
  PlanStatus status = 14;
  bool executable = 15;
  bool sync_only = 16;
  repeated string blocked_reasons = 17;
  string operation_id = 18;
  string goal_id = 19;
  string demand_id = 20;
  int32 target_id = 21;
  int32 item_id = 22;
  int32 count = 23;
  int32 vase_id = 24;
  repeated int32 flower_ids = 25;
  repeated CostGate cost_gates = 26;
  string blocking_stage = 27;
  ExecutionLane lane = 28;
  int64 cooldown_until_ms = 29;
  string cooldown_reason = 30;
  int64 target_uid = 31;
  repeated int64 target_uids = 32;
  int32 batch_id = 33;
  int32 slot_id = 34;
  int32 task_id = 35;
  int32 milestone_index = 36;
}

message DomainStatus {
  string category = 1;
  string domain = 2;
  bool observed = 3;
  PlanStatus status = 4;
  repeated string blocked_reasons = 5;
  string last_error = 6;
  ExecutionLane lane = 7;
  int64 cooldown_until_ms = 8;
  string cooldown_reason = 9;
}

message FeatureCapability {
  string id = 1;
  string label = 2;
  string category = 3;
  string domain = 4;
  string action = 5;
  PlanStatus status = 6;
  bool executable = 7;
  bool sync_only = 8;
  repeated string blocked_reasons = 9;
}

message RequirementView {
  int32 item_id = 1;
  string item_name = 2;
  int32 required = 3;
  int32 owned = 4;
  int32 missing = 5;
  // True when the requirement is a flower item that auto-plant can use as a
  // planting deficit source.
  bool planting_relevant = 6;
  string source = 7;
  repeated string blocked_reasons = 8;
}

message DemandView {
  string id = 1;
  string goal_id = 2;
  string category = 3;
  string domain = 4;
  string entity_id = 5;
  string label = 6;
  int32 item_id = 7;
  string item_name = 8;
  int32 required = 9;
  int32 owned = 10;
  int32 allocated = 11;
  int32 available = 12;
  int32 missing = 13;
  int32 priority = 14;
  string kind = 15;
  string source = 16;
  repeated string blocked_reasons = 17;
  PlanStatus status = 18;
  string blocking_stage = 19;
  repeated CostGate cost_gates = 20;
}

message CostGate {
  string id = 1;
  GateResourceKind resource_kind = 2;
  string label = 3;
  int32 item_id = 4;
  int64 required = 5;
  int64 available = 6;
  PlanStatus status = 7;
  repeated string blocked_reasons = 8;
  bool hard = 9;
  string source = 10;
}

message VaseView {
  int32 vase_id = 1;
  int64 u_time_ms = 2;
  int64 c_time_ms = 3;
}

message FlowerArtAvailabilityView {
  int32 art_id = 1;
  string art_name = 2;
  int32 vase_id = 3;
  int32 level = 4;
  int32 sale_value = 5;
  bool level_ok = 6;
  bool vase_unlocked = 7;
  bool craftable = 8;
  repeated RequirementView requirements = 9;
  repeated string blocked_reasons = 10;
}

message OrderStatisticsView {
  bool observed = 1;
  int32 day_id = 2;
  int32 resident_normal_finished = 3;
  int32 palace_finished = 4;
  int32 customer_finished = 5;
  int32 resident_satin_finished = 6;
  int32 resident_decorate_finished = 7;
  int32 flower_art_sold = 8;
  int64 updated_at_ms = 9;
  int64 created_at_ms = 10;
  repeated string blocked_reasons = 11;
}

message InventoryLedgerView {
  repeated InventoryLedgerItem items = 1;
}

message InventoryLedgerItem {
  int32 item_id = 1;
  string item_name = 2;
  int32 owned = 3;
  int32 allocated = 4;
  int32 available = 5;
}

message BlockingSummary {
  int32 total = 1;
  repeated BlockingGroup groups = 2;
}

message BlockingGroup {
  string category = 1;
  string domain = 2;
  string stage = 3;
  PlanStatus status = 4;
  int32 count = 5;
  repeated string reasons = 6;
}

message RuntimeStatisticsView {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp stopped_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  bool running = 4;
  repeated RuntimeResourceTotal resource_gains = 5;
  repeated RuntimeActionTotal order_completions = 6;
  repeated RuntimeActionTotal task_completions = 7;
  repeated RuntimeActionTotal operation_completions = 8;
  int64 total_operations = 9;
}

message RuntimeResourceTotal {
  string key = 1;
  string label = 2;
  int32 item_id = 3;
  int64 gained = 4;
}

message RuntimeActionTotal {
  string key = 1;
  string label = 2;
  int64 count = 3;
}

message StreamEventsRequest {
  // Optional: limit to one account. Empty = all.
  string account_id = 1;
  string account_name = 2;
  // Optional: only emit these event kinds (e.g. "operation_planned",
  // "operation_ack", "land_changed", "snapshot"). Empty = all.
  repeated string kinds = 3;
  // Number of persisted historical events to replay before live events.
  // Default is server-defined; negative disables replay.
  int32 replay_limit = 4;
  // Optional cursor. When set, replay only events with id greater than this.
  int64 after_event_id = 5;
}

message Event {
  // Monotonic SQLite event_log id. Zero means the event was not persisted.
  int64 id = 12;
  google.protobuf.Timestamp ts = 1;
  string account_id = 2;
  string account_name = 3;
  // Stable machine-readable event type, e.g. "land_changed" or
  // "operation_failed".
  string kind = 4;
  // Human-readable summary, suitable for terminal display.
  string message = 5;
  // Structured payload as JSON (so the daemon doesn't need a wire schema for
  // every internal event type). Contents stable per kind.
  string payload_json = 6;
  // Coarse log grouping for UI filters:
  // account|basic|plant|order|union|activity|system.
  string category = 7;
  // Short human-readable type label, e.g. "田地" or "操作失败".
  string label = 8;
  // info|warn|error. Derived by the daemon when callers do not set it.
  string level = 9;
  // Stable feature domain within category, e.g. "farm.land" or
  // "order.customer".
  string domain = 10;
  // Stable action within domain, e.g. "harvest", "sync", "blocked".
  string action = 11;
}

message DessertRuntimeView {
  bool observed = 1;
  bool shadow_only = 2;
  bool policy_enabled = 3;
  uint64 session_epoch = 4;
  int32 batch_id = 5;
  int32 mode = 6;
  uint64 authority_revision = 7;
  string board_hash = 8;
  bool board_owned = 9;
  bool takeover_requested = 10;
  bool waiting = 11;
  int64 waiting_remaining_ms = 12;
  int32 frozen_waiting_level = 13;
  int32 session_energy_used = 14;
  string suggestion = 15;
  string blocked_reason = 16;
  bool failure_locked = 17;
  bool live_evidence_ready = 18;
  bool live_execution_allowed = 19;
  int32 max_session_energy = 20;
  int32 min_energy_reserve = 21;
}

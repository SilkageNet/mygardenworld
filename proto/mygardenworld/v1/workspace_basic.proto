syntax = "proto3";

package mygardenworld.v1;

import "google/protobuf/timestamp.proto";
import "mygardenworld/v1/workspace_common.proto";

message BasicView {
  int64 account_id = 1;
  string account_name = 2;
  int64 role_id = 3;
  google.protobuf.Timestamp captured_at = 4;
  int32 gold = 5;
  int32 water_drops = 6;
  int32 water_drops_total = 7;
  int64 water_drops_next_ms = 8;
  int32 level = 9;
  int32 experience = 10;
  int32 experience_to_next_level = 11;
  int32 next_level_experience = 12;
  bool level_maxed = 13;
  int32 diamonds_free = 14;
  int32 diamonds_paid = 15;
  int32 vip = 16;
  int32 vip_exp = 17;
  bool noble_eligible = 18;
  repeated string observed_namespaces = 19;
  int32 unknown_rpc_count = 20;
  int32 unknown_namespace_count = 21;
  RunnerDiagnostics diagnostics = 22;
  repeated DomainStatus domain_statuses = 23;
  repeated PlannedOperation planned_operations = 24;
  BlockingSummary blocking_summary = 25;
  bool reputation_observed = 26;
  int32 reputation_score = 27;
  int64 reputation_last_sync_time_ms = 28;
  int64 reputation_last_view_time_ms = 29;
  RuntimeStatisticsView runtime_statistics = 30;
  repeated PendingTaskView pending_tasks = 31;
  PearlHireStatusView pearl_hire = 32;
  // Manual video rewards owned by the basic workspace: double gold, the free
  // shop gift, and video pearls. They are status-only and never auto-claimed.
  repeated VideoActionStatusView video_actions = 33;
}

message PearlHireStatusView {
  int32 ticket_count = 1;
  int32 ticket_used_today = 2;
  int32 daily_ticket_limit = 3;
  repeated PearlLaborSlotView slots = 4;
}

message PearlLaborSlotView {
  int32 place_id = 1;
  int64 labor_uid = 2;
  string labor_name = 3;
  int64 labor_end_time_ms = 4;
  bool active = 5;
}

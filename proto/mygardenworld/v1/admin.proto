syntax = "proto3";

package mygardenworld.v1;

import "google/protobuf/timestamp.proto";
import "mygardenworld/v1/auth.proto";
import "mygardenworld/v1/channel.proto";
import "mygardenworld/v1/redeem.proto";

service AdminService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc GetSystemStats(GetSystemStatsRequest) returns (GetSystemStatsResponse);
  rpc ListRedeemSources(ListRedeemSourcesRequest) returns (ListRedeemSourcesResponse);
  rpc UpsertRedeemSource(UpsertRedeemSourceRequest) returns (UpsertRedeemSourceResponse);
  rpc DeleteRedeemSource(DeleteRedeemSourceRequest) returns (DeleteRedeemSourceResponse);
  rpc SyncRedeemSource(SyncRedeemSourceRequest) returns (SyncRedeemSourceResponse);
  rpc UpdateRedeemCodeExpiry(UpdateRedeemCodeExpiryRequest) returns (UpdateRedeemCodeExpiryResponse);
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  optional UserRole role = 4;
  optional int32 max_accounts = 5;
  optional UserStatus status = 6;
}

message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message UpdateUserRequest {
  int64 user_id = 1;
  optional UserRole role = 2;
  optional int32 max_accounts = 3;
  optional UserStatus status = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message GetSystemStatsRequest {}

message GetSystemStatsResponse {
  int32 total_users = 1;
  int32 total_game_accounts = 2;
  int32 active_runners = 3;
  int32 connected_runners = 4;
}

enum RedeemSourceType {
  REDEEM_SOURCE_TYPE_UNSPECIFIED = 0;
  REDEEM_SOURCE_TYPE_MYGARDENWORLD = 1;
  REDEEM_SOURCE_TYPE_CUSTOM_HTTP = 2;
}

message RedeemSource {
  int64 id = 1;
  string name = 2;
  RedeemSourceType type = 3;
  string base_url = 4;
  Channel channel = 5;
  string parser_config_json = 6;
  bool enabled = 7;
  bool push_enabled = 8;
  int32 poll_interval_seconds = 9;
  string remote_instance_id = 10;
  string cursor = 11;
  google.protobuf.Timestamp last_sync_at = 12;
  string last_error = 13;
  // Distinct codes attributed to this source, regardless of outcome.
  int64 observed_count = 14;
  // Success, already-redeemed, and expired outcomes all establish good-faith input.
  int64 trusted_count = 15;
  int64 success_count = 16;
  int64 already_redeemed_count = 17;
  int64 expired_count = 18;
  int64 invalid_count = 19;
  // Pending, retryable, and unknown outcomes that still need a terminal decision.
  int64 pending_count = 20;
}

message ListRedeemSourcesRequest {}

message ListRedeemSourcesResponse {
  repeated RedeemSource sources = 1;
}

message UpsertRedeemSourceRequest {
  int64 id = 1;
  string name = 2;
  RedeemSourceType type = 3;
  string base_url = 4;
  Channel channel = 5;
  string parser_config_json = 6;
  bool enabled = 7;
  bool push_enabled = 8;
  int32 poll_interval_seconds = 9;
}

message UpsertRedeemSourceResponse {
  RedeemSource source = 1;
}

message DeleteRedeemSourceRequest {
  int64 id = 1;
}

message DeleteRedeemSourceResponse {}

message SyncRedeemSourceRequest {
  int64 id = 1;
}

message SyncRedeemSourceResponse {
  RedeemSource source = 1;
}

enum RedeemExpiryOverrideMode {
  REDEEM_EXPIRY_OVERRIDE_MODE_UNSPECIFIED = 0;
  REDEEM_EXPIRY_OVERRIDE_MODE_FINITE = 1;
  REDEEM_EXPIRY_OVERRIDE_MODE_PERMANENT = 2;
  // Removes the local override and recalculates expiry from source evidence.
  REDEEM_EXPIRY_OVERRIDE_MODE_SOURCE = 3;
}

message UpdateRedeemCodeExpiryRequest {
  string fingerprint = 1;
  RedeemExpiryOverrideMode mode = 2;
  // Required only for FINITE and must be in the future.
  google.protobuf.Timestamp expires_at = 3;
}

message UpdateRedeemCodeExpiryResponse {
  RedeemCode code = 1;
}

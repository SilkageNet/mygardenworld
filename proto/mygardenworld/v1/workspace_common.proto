syntax = "proto3";

package mygardenworld.v1;

import "google/protobuf/timestamp.proto";

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_READY = 1;
  PLAN_STATUS_MANAGED = 2;
  PLAN_STATUS_SYNC_ONLY = 3;
  PLAN_STATUS_ADAPTER_MISSING = 4;
  PLAN_STATUS_BLOCKED = 5;
  PLAN_STATUS_SKIPPED = 6;
}

enum GateResourceKind {
  GATE_RESOURCE_KIND_UNSPECIFIED = 0;
  GATE_RESOURCE_KIND_GOLD = 1;
  GATE_RESOURCE_KIND_DIAMOND = 2;
  GATE_RESOURCE_KIND_ITEM = 3;
  GATE_RESOURCE_KIND_WATER_DROP = 4;
  GATE_RESOURCE_KIND_LEVEL = 5;
  GATE_RESOURCE_KIND_VASE = 6;
  GATE_RESOURCE_KIND_POLICY = 7;
  GATE_RESOURCE_KIND_STATE = 8;
  GATE_RESOURCE_KIND_ADAPTER = 9;
}

enum ExecutionLane {
  EXECUTION_LANE_UNSPECIFIED = 0;
  EXECUTION_LANE_FARM = 1;
  EXECUTION_LANE_SIDE = 2;
}

enum AccountHealth {
  ACCOUNT_HEALTH_UNSPECIFIED = 0;
  ACCOUNT_HEALTH_OFFLINE = 1;
  ACCOUNT_HEALTH_ONLINE = 2;
  ACCOUNT_HEALTH_BLOCKED = 3;
  ACCOUNT_HEALTH_SESSION_EXPIRED = 4;
}

// VideoActionState is deliberately about server-observed eligibility. READY
// means the user can try the action in the official client; it does not claim
// that the platform advertising SDK currently has an ad loaded.
enum VideoActionState {
  VIDEO_ACTION_STATE_UNSPECIFIED = 0;
  VIDEO_ACTION_STATE_UNKNOWN = 1;
  VIDEO_ACTION_STATE_READY = 2;
  VIDEO_ACTION_STATE_COOLDOWN = 3;
  VIDEO_ACTION_STATE_EXHAUSTED = 4;
  VIDEO_ACTION_STATE_ACTIVE = 5;
}

message VideoActionRewardView {
  int32 item_id = 1;
  string item_name = 2;
  int32 count = 3;
}

// Read-only manual-action status. The daemon never fabricates advertising SDK
// callbacks; these records are reminders derived from authoritative game state.
message VideoActionStatusView {
  string id = 1;
  string label = 2;
  bool observed = 3;
  VideoActionState state = 4;
  int32 used = 5;
  int32 limit = 6;
  int64 available_at_ms = 7;
  int64 expires_at_ms = 8;
  repeated VideoActionRewardView rewards = 9;
  string detail = 10;
}

// WorkspaceLogCategory is the stable product-level grouping used by the log
// workspace. Internal runner categories and domains remain available on Event
// for diagnostics, but never determine which tabs exist in the Web UI.
enum WorkspaceLogCategory {
  WORKSPACE_LOG_CATEGORY_UNSPECIFIED = 0;
  WORKSPACE_LOG_CATEGORY_ACCOUNT = 1;
  WORKSPACE_LOG_CATEGORY_BASIC = 2;
  WORKSPACE_LOG_CATEGORY_GARDEN = 3;
  WORKSPACE_LOG_CATEGORY_ORDERS = 4;
  WORKSPACE_LOG_CATEGORY_UNION = 5;
  WORKSPACE_LOG_CATEGORY_ACTIVITIES = 6;
  WORKSPACE_LOG_CATEGORY_WAREHOUSE = 7;
  WORKSPACE_LOG_CATEGORY_SYSTEM = 8;
}

message AccountStatus {
  int64 account_id = 1;
  string account_name = 2;
  // Live runtime state: true only while the daemon currently holds a WS.
  bool connected = 3;
  google.protobuf.Timestamp last_event_at = 4;
  int32 known_lands = 5;
  // Recommendation kind histogram: harvest=N, plant=N, water=N, wait=N, ...
  map<string, int32> by_kind = 6;
  int32 flower_stock_total = 7;
  // Persisted user intent: true when automation should run once the account is started.
  bool automation_enabled = 8;
  RunnerDiagnostics diagnostics = 9;
  repeated DomainStatus domain_statuses = 10;
  AccountHealth health = 11;
  string last_error = 12;
  int32 level = 13;
  int32 experience = 14;
  int32 vip = 15;
  int32 vip_exp = 16;
  bool noble_eligible = 17;
  bool reputation_observed = 18;
  int32 reputation_score = 19;
  int64 reputation_last_sync_time_ms = 20;
  int64 reputation_last_view_time_ms = 21;
  RuntimeStatisticsView runtime_statistics = 22;
  // Remaining within-level XP to advance; 0 when maxed or unknown.
  int32 experience_to_next_level = 23;
  // c_lvl[level].exp requirement for the current level; 0 when maxed.
  int32 next_level_experience = 24;
  bool level_maxed = 25;
  // Last-known game-server idx. This is included in the pushed runtime view
  // so the Web UI does not need to re-list accounts after the first login.
  int32 gs_idx = 26;
}

message RunnerDiagnostics {
  string current_operation = 1;
  google.protobuf.Timestamp current_operation_started_at = 2;
  string last_operation = 3;
  google.protobuf.Timestamp last_operation_at = 4;
  string last_operation_error = 5;
  google.protobuf.Timestamp last_operation_error_at = 6;
  google.protobuf.Timestamp next_decision_at = 7;
  string session_invalidated_reason = 8;
  repeated string blocked_reasons = 9;
  int32 unknown_rpc_count = 10;
  int32 unknown_namespace_count = 11;
  repeated string observed_namespaces = 12;
}

message PendingTaskView {
  // Stable category for grouping in the dashboard.
  string category = 1;
  // Server id within that category, e.g. box id, npc id, or task id.
  string id = 2;
  string title = 3;
  // Progress fields are populated for task-style entries.
  int32 finished = 4;
  int32 target = 5;
  PlanStatus status = 6;
  repeated RequirementView requirements = 7;
  int64 cooldown_until_ms = 8;
  string cooldown_reason = 9;
  // Business module that can advance an incomplete task. Completed tasks only
  // need their category's claim switch, regardless of this feature.
  TaskExecutionFeature execution_feature = 10;
  // False means the task stays pending because no safe protocol path exists.
  bool auto_completion_supported = 11;
}

enum TaskExecutionFeature {
  TASK_EXECUTION_FEATURE_UNSPECIFIED = 0;
  TASK_EXECUTION_FEATURE_CLAIM_ONLY = 1;
  TASK_EXECUTION_FEATURE_STORY = 2;
  TASK_EXECUTION_FEATURE_PLANTING = 3;
  TASK_EXECUTION_FEATURE_RESIDENT_ORDER = 4;
  TASK_EXECUTION_FEATURE_FLOWER_RACK = 5;
  TASK_EXECUTION_FEATURE_CUSTOMER_ORDER = 6;
  TASK_EXECUTION_FEATURE_CULTIVATE_SHOP = 7;
  TASK_EXECUTION_FEATURE_PALACE_ORDER = 8;
  TASK_EXECUTION_FEATURE_PEARL_HIRE = 9;
  TASK_EXECUTION_FEATURE_FRIEND_TOUCH = 10;
  TASK_EXECUTION_FEATURE_VIDEO = 11;
  TASK_EXECUTION_FEATURE_ZOO_STROKE = 12;
  TASK_EXECUTION_FEATURE_CULTIVATION = 13;
}

message PlannedOperation {
  string category = 1;
  string domain = 2;
  string action = 3;
  string rpc = 4;
  string reason = 5;
  repeated int32 land_ids = 6;
  int32 flower_id = 7;
  int32 priority = 8;
  int32 gold_cost = 9;
  int32 diamond_cost = 10;
  map<int32, int32> item_cost = 11;
  string feature_id = 12;
  string label = 13;
  PlanStatus status = 14;
  bool executable = 15;
  bool sync_only = 16;
  repeated string blocked_reasons = 17;
  string operation_id = 18;
  string goal_id = 19;
  string demand_id = 20;
  int32 target_id = 21;
  int32 item_id = 22;
  int32 count = 23;
  int32 vase_id = 24;
  repeated int32 flower_ids = 25;
  repeated CostGate cost_gates = 26;
  string blocking_stage = 27;
  ExecutionLane lane = 28;
  int64 cooldown_until_ms = 29;
  string cooldown_reason = 30;
  int64 target_uid = 31;
  repeated int64 target_uids = 32;
  int32 batch_id = 33;
  int32 slot_id = 34;
  int32 task_id = 35;
  int32 milestone_index = 36;
}

message DomainStatus {
  string category = 1;
  string domain = 2;
  bool observed = 3;
  PlanStatus status = 4;
  repeated string blocked_reasons = 5;
  string last_error = 6;
  ExecutionLane lane = 7;
  int64 cooldown_until_ms = 8;
  string cooldown_reason = 9;
}

message FeatureCapability {
  string id = 1;
  string label = 2;
  string category = 3;
  string domain = 4;
  string action = 5;
  PlanStatus status = 6;
  bool executable = 7;
  bool sync_only = 8;
  repeated string blocked_reasons = 9;
}

message RequirementView {
  int32 item_id = 1;
  string item_name = 2;
  int32 required = 3;
  int32 owned = 4;
  int32 missing = 5;
  // True when the requirement is a flower item that auto-plant can use as a
  // planting deficit source.
  bool planting_relevant = 6;
  string source = 7;
  repeated string blocked_reasons = 8;
}

message DemandView {
  string id = 1;
  string goal_id = 2;
  string category = 3;
  string domain = 4;
  string entity_id = 5;
  string label = 6;
  int32 item_id = 7;
  string item_name = 8;
  int32 required = 9;
  int32 owned = 10;
  int32 allocated = 11;
  int32 available = 12;
  int32 missing = 13;
  int32 priority = 14;
  string kind = 15;
  string source = 16;
  repeated string blocked_reasons = 17;
  PlanStatus status = 18;
  string blocking_stage = 19;
  repeated CostGate cost_gates = 20;
}

message CostGate {
  string id = 1;
  GateResourceKind resource_kind = 2;
  string label = 3;
  int32 item_id = 4;
  int64 required = 5;
  int64 available = 6;
  PlanStatus status = 7;
  repeated string blocked_reasons = 8;
  bool hard = 9;
  string source = 10;
}

message BlockingSummary {
  int32 total = 1;
  repeated BlockingGroup groups = 2;
}

message BlockingGroup {
  string category = 1;
  string domain = 2;
  string stage = 3;
  PlanStatus status = 4;
  int32 count = 5;
  repeated string reasons = 6;
}

message RuntimeStatisticsView {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp stopped_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  bool running = 4;
  repeated RuntimeResourceTotal resource_gains = 5;
  repeated RuntimeActionTotal order_completions = 6;
  repeated RuntimeActionTotal task_completions = 7;
  repeated RuntimeActionTotal operation_completions = 8;
  int64 total_operations = 9;
}

message RuntimeResourceTotal {
  string key = 1;
  string label = 2;
  int32 item_id = 3;
  int64 gained = 4;
}

message RuntimeActionTotal {
  string key = 1;
  string label = 2;
  int64 count = 3;
}

message Event {
  // Monotonic SQLite event_log id. Zero means the event was not persisted.
  int64 id = 1;
  google.protobuf.Timestamp ts = 2;
  int64 account_id = 3;
  string account_name = 4;
  // Stable machine-readable event type, e.g. "land_changed" or
  // "operation_failed".
  string kind = 5;
  // Human-readable summary, suitable for terminal display.
  string message = 6;
  // Structured payload as JSON (so the daemon doesn't need a wire schema for
  // every internal event type). Contents stable per kind.
  string payload_json = 7;
  WorkspaceLogCategory category = 8;
  // Short human-readable type label, e.g. "田地" or "操作失败".
  string label = 9;
  // info|warn|error. Derived by the daemon when callers do not set it.
  string level = 10;
  // Stable feature domain within category, e.g. "farm.land" or
  // "order.customer".
  string domain = 11;
  // Stable action within domain, e.g. "harvest", "sync", "blocked".
  string action = 12;
}
